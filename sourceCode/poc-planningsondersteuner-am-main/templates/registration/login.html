<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <title>Inloggen</title>
</head>
<body>
    <h1>Inloggen</h1>
    <p role="note" style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; color: #1e3a5f; background-color: #d9efff; border: 1px solid #60a5fa; border-left: 4px solid #2563eb; border-radius: 4px; line-height: 1.5;"><span aria-hidden="true" style="display: inline-flex; flex: 0 0 22px; align-items: center; justify-content: center; width: 22px; height: 22px; margin-top: 1px; color: white; background-color: #2563eb; border-radius: 50%; font-weight: bold; line-height: 1;">!</span><span>Sign in with your TOPdesk PoC account to view planning information and available actions.</span></p>

    {% if form.errors %}
        <p>Ongeldige gebruikersnaam of wachtwoord.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Inloggen</button>
    </form>
</body>
</html>
